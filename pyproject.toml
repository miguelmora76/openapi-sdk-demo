[project]
name = "claims-api-sdk-demo"
version = "0.1.0"
description = "Sample: FastAPI service -> committed OpenAPI spec -> generated typed client -> breaking-change gate"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "openapi-python-client>=0.21", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
